name: Build index

# 索引是 manifest 的只读投影（STORAGE-SPEC 不变量 I3）。
# Worker 只写 manifest，索引统一由本工作流重建，避免运行期写共享文件。
#
# 触发方式：
#   1. extensions/** 变更后自动 push 触发（PAT 或 App token 推送可触发）
#   2. Worker 写入成功后主动 workflow_dispatch（token 为默认 Actions token 时的兜底）
#   3. 仓库内手动触发
#
# 并发组保证同一时刻只有一个重建任务，新任务会取消旧任务，
# 因此重复触发只会留下一次基于最新 HEAD 的重建。

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因（由 Worker 写入，便于排查）'
        required: false
        default: 'manual'
  repository_dispatch:
    types: [build-index]

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    # 索引提交本身带 [skip ci]，这里的 actor 判断用于防御性兜底
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild and deep-validate index
        run: node scripts/migrate-v2/build-index.mjs --root .

      - name: Commit if changed
        run: |
          if git diff --quiet -- index; then
            echo "索引无变化"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index
          git commit -m "chore(index): rebuild projection [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "索引已提交"
              exit 0
            fi
            echo "推送失败，第 ${attempt} 次重试前先同步远端"
            git pull --rebase --autostash || true
          done
          echo "索引推送失败，请检查分支保护或并发冲突" >&2
          exit 1
