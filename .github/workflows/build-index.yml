name: Build index

# 索引是 manifest 的只读投影（STORAGE-SPEC 不变量 I3）。
# Worker 只写 manifest，索引统一由本工作流重建，避免运行期写共享文件。
#
# 触发方式：
#   1. extensions/** 变更后自动 push 触发（PAT 或 App token 推送可触发）
#   2. Worker 写入成功后主动 workflow_dispatch（token 为默认 Actions token 时的兜底）
#   3. 仓库内手动触发
#
# 并发组保证同一时刻只有一个重建任务；排队执行（不取消），
# 避免提交记录里出现「运行被取消」的误报。
#
# 提交采用「单一快照」模式：仓库历史永远保持 1 个提交，
# 每次重建以新的根提交强制替换（force push），把累积的
# manifest 提交与索引变更一并折叠进唯一快照。

on:
  push:
    branches: [main]
    # 只监听真源文件：新提交会先写脚本/封面、最后写 manifest，
    # 如果监听整个 extensions/**，前两次提交会在「目录还没有 manifest」时触发并失败。
    paths:
      - 'extensions/**/manifest.json'
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因（由 Worker 写入，便于排查）'
        required: false
        default: 'manual'
  repository_dispatch:
    types: [build-index]

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    # 索引提交本身带 [skip ci]，这里的 actor 判断用于防御性兜底
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild and deep-validate index
        run: node scripts/migrate-v2/build-index.mjs --root .

      - name: Commit as single snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交三份投影，避免把异常残留（如临时目录）带进仓库
          git add index/public.json index/review.json index/disuse.json
          # 单一快照：以最新内容重建根提交并强制替换 main，
          # 重试时把基座换成最新远端，避免覆盖并发落库的 manifest 变更
          for attempt in 1 2 3; do
            git fetch origin main --depth=1
            git reset --soft FETCH_HEAD
            TREE=$(git write-tree)
            REMOTE_TREE=$(git rev-parse FETCH_HEAD^{tree})
            if [ "$TREE" = "$REMOTE_TREE" ]; then
              echo "内容无变化，跳过快照"
              exit 0
            fi
            NEW=$(git commit-tree "$TREE" -m "snapshot: sync extensions and index [skip ci]")
            if git push --force origin "$NEW:refs/heads/main"; then
              echo "单一快照已推送"
              exit 0
            fi
            echo "推送失败，第 ${attempt} 次重试前先同步远端"
          done
          echo "快照推送失败，请检查分支保护或并发冲突" >&2
          exit 1
